<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>內湖國小學區與校園動線圖</title>
<style>
:root{--navy:#1c2333;--navy2:#2a3348;--gold:#f2c14e;--ink:#1f2430}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dff1f7;font-family:"Noto Sans TC","Microsoft JhengHei","微軟正黑體","PingFang TC",sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.94);
  box-shadow:0 2px 6px rgba(0,0,0,.18);font-size:14px;line-height:1.35;pointer-events:auto;cursor:pointer;user-select:none;will-change:transform}
.lb.bld{background:var(--navy);color:#fff;font-weight:700;font-size:16px;border-radius:7px;padding:5px 13px;border-bottom:3px solid var(--gold);letter-spacing:1px}
.lb.gate{background:#fff;border:2px solid #d9482b;color:#b3361d;font-weight:700}
.lb.road{background:rgba(60,66,78,.82);color:#fff;font-size:13px;cursor:default}
.lb.sel{background:var(--navy);color:#fff;font-weight:700;font-size:16px;border-radius:7px;padding:6px 14px;border:2px solid var(--gold);cursor:default;z-index:5}
#title{position:fixed;left:14px;top:12px;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 16px;box-shadow:0 3px 12px rgba(0,0,0,.15);z-index:10}
#title b{display:block;font-size:19px;letter-spacing:1px}
#title span{font-size:12.5px;color:#667}
#side{position:fixed;left:14px;top:86px;bottom:14px;width:214px;background:var(--navy);color:#fff;border-radius:14px;overflow:auto;padding:8px 8px 14px;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .25s}
#side.hide{transform:translateX(-250px)}
#side details{border-bottom:1px solid rgba(255,255,255,.1)}
#side summary{list-style:none;cursor:pointer;padding:11px 10px;font-size:16px;font-weight:700;letter-spacing:1px;display:flex;justify-content:space-between}
#side summary::-webkit-details-marker{display:none}
#side summary::after{content:"＋";color:var(--gold);font-weight:400}
#side details[open] summary::after{content:"－"}
#side .it{display:block;width:100%;text-align:left;background:none;border:0;color:#dfe5f2;font:inherit;font-size:14.5px;padding:7px 10px 7px 18px;border-radius:8px;cursor:pointer}
#side .it small{color:#93a0bb;margin-left:6px;font-size:12px}
#side .it:hover{background:var(--navy2)}
#side .it.on{background:var(--gold);color:#1c2333;font-weight:700}
#side .it.on small{color:#4a4020}
#tools{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:10}
.btn{background:#fff;border:0;border-radius:999px;padding:9px 15px;font:inherit;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;color:var(--ink)}
.btn:active{transform:translateY(1px)}
#menu{position:fixed;left:14px;bottom:14px;z-index:11;display:none}
#compass{position:fixed;right:16px;top:14px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:10}
#compass svg{width:100%;height:100%}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(28,35,51,.78);color:#fff;font-size:12.5px;padding:6px 14px;border-radius:999px;z-index:9;white-space:nowrap;transition:opacity .6s}
[hidden]{display:none!important}
.lb{transition:opacity .15s;touch-action:none}
.lb.off{opacity:0;pointer-events:none}
.lb.sel .x{margin-left:10px;opacity:.75;font-weight:400}
.lb.sel{cursor:pointer}
#q{width:100%;margin:2px 0 6px;padding:9px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:#2a3348;color:#fff;font:inherit;font-size:14.5px;outline:none}
#q::placeholder{color:#93a0bb}
#q:focus{border-color:var(--gold)}
#side .it:focus-visible,#side summary:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff;z-index:99;padding:30px;text-align:center;font-size:17px;line-height:1.8}
@media (max-width:1024px),(max-height:520px){
  #side{top:76px;bottom:66px;width:214px}
  #side.hide{transform:translateX(-250px)}
  #menu{display:block}
  #tools{flex-direction:column;align-items:flex-end}
  .btn{padding:9px 12px}
  #hint{bottom:70px;font-size:12px}
  .btn{min-height:44px}
  #tools{gap:8px}
  #title b{font-size:16px}
  .lb{font-size:12.5px}.lb.bld{font-size:14px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="內湖國小校園立體圖，可拖曳旋轉"></canvas>
<div id="labels"></div>
<div id="title"><b>內湖國小　校園立體圖</b><span>新竹市香山區內湖國民小學｜115 學年度</span></div>
<aside id="side"></aside>
<div id="compass"><svg viewBox="-30 -30 60 60"><g id="needle"><path d="M0 -22 L8 6 L0 1 L-8 6 Z" fill="#d9482b"/><g transform="translate(0 15)"><text id="nT" x="0" y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2430">北</text></g></g></svg></div>
<div id="hint">拖曳旋轉・滾輪或雙指縮放・右鍵拖曳或按「移動」平移・點左側清單找教室</div>
<button class="btn" id="menu">☰ 找教室</button>
<div id="tools">
  <button class="btn" id="bPan" aria-pressed="false">移動：關</button>
  <button class="btn" id="bLabel">標籤：開</button>
  <button class="btn" id="bTop">俯視</button>
  <button class="btn" id="bHome">回全景</button>
</div>
<div id="err">立體圖需要連上網路載入繪圖元件（three.js），<br>請確認網路後重新整理。</div>
